name: Test latest release on latest nightly Roc

# Every morning, test the latest published roc-prng bundle, by its real URL,
# on the newest Roc nightly. Green moves the recommendation forward in that
# release's notes. Red means we adapt to Roc, or report a bug.
#
# Speed decides. dev, size and interpreter run too but must not hold back a
# recommendation.
#
# Publishing does not trigger this. The release workflow already tested that
# bundle while it was a draft.

on:
  schedule:
    # Nightlies publish between 10:00 and 13:30 UTC.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-roc
  cancel-in-progress: false

jobs:
  # Resolved once, so every leg runs the exact same nightly against the exact
  # same release.
  resolve:
    uses: niclas-ahden/roc-workflows/.github/workflows/resolve-versions.yml@v3
    with:
      release: true

  # The versions go in the job name, because `run-name` cannot see `needs`.
  test:
    needs: resolve
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      roc: ${{ needs.resolve.outputs.nightly }}
      label: roc-prng ${{ needs.resolve.outputs.release }} on ${{ needs.resolve.outputs.nightly }}
      ref: ${{ needs.resolve.outputs.release }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}

  advisory:
    needs: resolve
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      roc: ${{ needs.resolve.outputs.nightly }}
      label: Advisory ${{ needs.resolve.outputs.release }} on ${{ needs.resolve.outputs.nightly }}
      opts: '["dev", "size", "interpreter"]'
      ref: ${{ needs.resolve.outputs.release }}
      bundle-url: ${{ needs.resolve.outputs.bundle }}

  # Green on every leg: recommend this nightly in the tested release's notes.
  recommend:
    needs: [resolve, test]
    permissions:
      contents: write
    uses: niclas-ahden/roc-workflows/.github/workflows/name-nightly.yml@v3
    with:
      release: ${{ needs.resolve.outputs.release }}
      nightly: ${{ needs.resolve.outputs.nightly }}

  name-commit-range:
    name: Name the commit range
    needs: [resolve, test]
    # Only for a red suite. A failed `resolve` would leave every version below
    # empty.
    if: needs.test.result == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Name the commit range
        run: |
          echo "::error::roc-prng ${{ needs.resolve.outputs.release }} fails on roc ${{ needs.resolve.outputs.nightly }}"
          echo "  https://github.com/roc-lang/roc/compare/${{ needs.resolve.outputs.prev_sha }}...${{ needs.resolve.outputs.sha }}"
